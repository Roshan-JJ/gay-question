```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Be Honest 👀</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;

    color: white;

    background:
        radial-gradient(circle at 20% 20%, #ff00cc55, transparent 30%),
        radial-gradient(circle at 80% 80%, #5b5cff55, transparent 30%),
        linear-gradient(135deg, #050008, #17002c, #020006);

    transition: background 0.5s;
}

/* =========================
   BACKGROUND
========================= */

.orb {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .5;
    pointer-events: none;
    animation: float 8s infinite alternate ease-in-out;
}

.orb1 {
    background: #ff00cc;
    top: -100px;
    left: -100px;
}

.orb2 {
    background: #514cff;
    right: -100px;
    bottom: -100px;
    animation-delay: 2s;
}

@keyframes float {
    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(100px,70px);
    }
}

/* =========================
   CARD
========================= */

.card {
    width: 90%;
    max-width: 700px;

    padding: 60px 35px;

    text-align: center;

    border-radius: 30px;

    background: rgba(255,255,255,.08);

    border: 1px solid rgba(255,255,255,.2);

    backdrop-filter: blur(25px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.6),
        inset 0 0 40px rgba(255,255,255,.03);

    position: relative;

    z-index: 5;
}

.emoji {
    font-size: 65px;

    animation: bounce 2s infinite;
}

@keyframes bounce {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }

}

h1 {

    font-size: clamp(38px,7vw,65px);

    margin: 15px 0;

    background:
        linear-gradient(
            90deg,
            #ff4ecd,
            #ffffff,
            #6c63ff
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;
}

.subtitle {

    color: #c9c2d9;

    margin-bottom: 35px;

    font-size: 18px;
}

.question {

    font-size: 27px;

    margin-bottom: 35px;
}

/* =========================
   BUTTONS
========================= */

.buttons {

    position: relative;

    height: 150px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 30px;
}

button {

    border: none;

    padding: 16px 35px;

    border-radius: 50px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    transition: .25s ease;

    color: white;
}

#yesBtn {

    background:
        linear-gradient(
            135deg,
            #ff4ecd,
            #6c63ff
        );

    box-shadow:
        0 10px 30px #ff4ecd55;

}

#yesBtn:hover {

    transform: scale(1.1);

    box-shadow:
        0 15px 45px #ff4ecd88;

}

#noBtn {

    background: rgba(255,255,255,.1);

    border: 1px solid rgba(255,255,255,.25);

    position: relative;

}

#noBtn:hover {

    background: rgba(255,255,255,.18);

}

/* =========================
   STATUS
========================= */

#status {

    height: 25px;

    color: #ff9dea;

    font-size: 14px;

    margin-top: 10px;

}

/* =========================
   LOADING SCREEN
========================= */

#loading {

    display: none;
}

.loader {

    width: 70px;
    height: 70px;

    border: 6px solid rgba(255,255,255,.15);

    border-top-color: #ff4ecd;

    border-radius: 50%;

    margin: 0 auto 30px;

    animation: spin 1s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

.loadingText {

    font-size: 22px;

    color: #ddd;

    min-height: 30px;
}

/* =========================
   SUCCESS
========================= */

#success {

    display: none;
}

.heart {

    font-size: 85px;

    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }

}

#success h2 {

    font-size: clamp(30px,6vw,48px);

    margin: 20px 0;

}

#success p {

    font-size: 20px;

    color: #d5cfe0;

}

/* =========================
   CONFETTI
========================= */

.confetti {

    position: fixed;

    width: 10px;
    height: 18px;

    top: -30px;

    z-index: 100;

    animation: confettiFall linear forwards;

}

@keyframes confettiFall {

    to {

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;

    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .card {

        padding: 45px 20px;

    }

    .buttons {

        gap: 15px;

    }

    button {

        padding: 14px 24px;

        font-size: 16px;

    }

}

</style>
</head>


<body>

<!-- Background -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>


<div class="card">


<!-- =====================
     QUESTION
===================== -->

<div id="question">

    <div class="emoji">
        👀
    </div>

    <h1>
        BE HONEST.
    </h1>

    <p class="subtitle">
        Your answer will determine your fate.
    </p>

    <div class="question">
        Are you gay? 🌈
    </div>


    <div class="buttons">

        <button id="yesBtn">
            YES 😎
        </button>

        <button id="noBtn">
            NO 😏
        </button>

    </div>


    <div id="status">
        Choose wisely...
    </div>

</div>


<!-- =====================
     LOADING
===================== -->

<div id="loading">

    <div class="loader"></div>

    <div class="loadingText" id="loadingText">
        Analyzing your answer...
    </div>

</div>


<!-- =====================
     SUCCESS
===================== -->

<div id="success">

    <div class="heart">
        🌈❤️
    </div>

    <h2>
        HAHAHA! I KNEW IT! 💀
    </h2>

    <p>
        The truth has finally been revealed. 😂
    </p>

</div>


</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

const status = document.getElementById("status");

const question = document.getElementById("question");

const loading = document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const success =
    document.getElementById("success");


/* =========================================
   NO BUTTON
========================================= */

let attempts = 0;

const messages = [

    "Nice try 💀",

    "NOPE 😂",

    "Bro really thought 😭",

    "TRY AGAIN 💀",

    "You can't escape.",

    "I SAID NO ESCAPE 😭",

    "WHY ARE YOU STILL TRYING?",

    "JUST PRESS YES BRO 💀",

    "THE BUTTON HAS LEFT THE CHAT.",

    "ABSOLUTELY NOT 😂"

];


/*
   Detect mouse coming near
*/

document.addEventListener("mousemove", function(e) {

    const rect = noBtn.getBoundingClientRect();

    const buttonX =
        rect.left + rect.width / 2;

    const buttonY =
        rect.top + rect.height / 2;

    const distance =
        Math.hypot(
            e.clientX - buttonX,
            e.clientY - buttonY
        );


    /*
       Every time cursor gets
       within 120px, escape.
    */

    if(distance < 120) {

        moveNoButton();

    }

});


/* =========================================
   MOVE BUTTON
========================================= */

function moveNoButton() {

    attempts++;

    /*
       Make the button progressively faster
    */

    const speed =
        Math.max(
            0.08,
            0.30 - attempts * 0.015
        );


    noBtn.style.transition =
        `all ${speed}s cubic-bezier(.17,.67,.83,.67)`;


    /*
       Random position
    */

    const padding = 20;

    const maxX =
        window.innerWidth -
        noBtn.offsetWidth -
        padding;

    const maxY =
        window.innerHeight -
        noBtn.offsetHeight -
        padding;


    const x =
        Math.random() * maxX;

    const y =
        Math.random() * maxY;


    noBtn.style.position = "fixed";

    noBtn.style.left = x + "px";

    noBtn.style.top = y + "px";


    /*
       Change text
    */

    const index =
        Math.min(
            attempts - 1,
            messages.length - 1
        );

    noBtn.innerText =
        messages[index];


    status.innerText =
        "Escape attempt #" + attempts + " 💀";


    /*
       Make button slightly smaller
    */

    if(attempts > 3) {

        const scale =
            Math.max(
                0.65,
                1 - attempts * 0.025
            );

        noBtn.style.transform =
            `scale(${scale})`;

    }

}


/* =========================================
   EXTRA NO BUTTON CLICK
========================================= */

noBtn.addEventListener("click", function() {

    moveNoButton();

    status.innerText =
        "YOU ACTUALLY CLICKED IT?! 😭";

});


/* =========================================
   YES BUTTON
========================================= */

yesBtn.addEventListener("click", function() {

    /*
       Hide question
    */

    question.style.display = "none";


    /*
       Show fake loading
    */

    loading.style.display = "block";


    const texts = [

        "Analyzing your answer...",

        "Checking honesty levels...",

        "Consulting the council...",

        "Cross-referencing evidence...",

        "Running advanced calculations...",

        "Verdict incoming... 💀"

    ];


    let i = 0;


    const interval =
        setInterval(function() {

            loadingText.innerText =
                texts[i];

            i++;


            if(i >= texts.length) {

                clearInterval(interval);

            }

        }, 650);


    /*
       Reveal result
       after fake analysis
    */

    setTimeout(function() {

        loading.style.display = "none";

        success.style.display = "block";

        createConfetti();

    }, 4300);

});


/* =========================================
   CONFETTI
========================================= */

function createConfetti() {

    const amount = 150;


    for(let i = 0; i < amount; i++) {

        const piece =
            document.createElement("div");


        piece.classList.add("confetti");


        /*
           Random horizontal position
        */

        piece.style.left =
            Math.random() * 100 + "vw";


        /*
           Random animation duration
        */

        piece.style.animationDuration =
            (2 + Math.random() * 4) + "s";


        /*
           Random delay
        */

        piece.style.animationDelay =
            Math.random() * 1.5 + "s";


        /*
           Random size
        */

        piece.style.width =
            (5 + Math.random() * 8) + "px";

        piece.style.height =
            (8 + Math.random() * 15) + "px";


        /*
           Random rotation
        */

        piece.style.transform =
            `rotate(${Math.random()*360}deg)`;


        /*
           Random color
        */

        const colors = [

            "#ff4ecd",
            "#6c63ff",
            "#ffffff",
            "#00ffff",
            "#ffff00",
            "#ff6b6b"

        ];

        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        document.body.appendChild(piece);


        /*
           Remove after animation
        */

        setTimeout(function() {

            piece.remove();

        }, 7000);

    }

}


/* =========================================
   MOBILE SUPPORT
========================================= */

document.addEventListener(
    "touchstart",
    function(e) {

        /*
           If someone touches the NO button
        */

        if(
            e.target === noBtn
        ) {

            moveNoButton();

        }

    }
);

</script>

</body>
</html>
```
